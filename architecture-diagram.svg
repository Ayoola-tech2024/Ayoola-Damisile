  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="45" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700" letter-spacing="-0.3">Enterprise Google Cloud &amp; Edge FinTech Architecture</text>
  <text x="500" y="70" text-anchor="middle" fill="#8B949E" font-size="13">Architect: Ayoola Damisile · Google Knowledge Graph: /g/11ynvpcp11 · BuySolar.ng CAC: 8168912</text>

  <!-- Group 1: Ingestion & Edge Security -->
  <rect x="40" y="100" width="260" height="460" rx="12" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="100" width="260" height="36" rx="12" fill="#21262d"/>
  <text x="55" y="124" fill="#58A6FF" font-size="13" font-weight="600">1. INGESTION &amp; EDGE SECURITY</text>

  <!-- Client Node -->
  <rect x="60" y="155" width="220" height="60" rx="8" fill="#0d1117" stroke="#4285F4" stroke-width="1.2"/>
