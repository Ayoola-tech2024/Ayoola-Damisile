  <text x="405" y="303" fill="#8B949E" font-size="11">Timeout &gt; 2200ms Trigger</text>
  <text x="405" y="320" fill="#EA4335" font-size="11">Multi-Region us-central1 Failover</text>

  <!-- Eventarc & Pub/Sub -->
  <rect x="390" y="355" width="220" height="65" rx="8" fill="#0d1117" stroke="#30363D" stroke-width="1.2"/>
  <text x="405" y="380" fill="#FFFFFF" font-size="13" font-weight="600">Eventarc &amp; Cloud Pub/Sub</text>
  <text x="405" y="400" fill="#8B949E" font-size="11">Asynchronous Ledger Worker</text>

