  <text x="75" y="265" fill="#FFFFFF" font-size="13" font-weight="600">Cloud Armor &amp; Global LB</text>
  <text x="75" y="285" fill="#8B949E" font-size="11">DDoS Mitigation · Managed SSL</text>

  <!-- Cloud Run Gateway -->
  <rect x="60" y="325" width="220" height="75" rx="8" fill="#0d1117" stroke="#34A853" stroke-width="1.2"/>
  <text x="75" y="350" fill="#FFFFFF" font-size="13" font-weight="600">Cloud Run: Edge Gateway</text>
  <text x="75" y="370" fill="#8B949E" font-size="11">682 Next.js Routes · Scale-to-Zero</text>
  <text x="75" y="388" fill="#34A853" font-size="11" font-weight="500">HMAC SHA-512 Verification</text>

