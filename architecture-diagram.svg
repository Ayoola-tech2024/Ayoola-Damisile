  <rect x="700" y="100" width="260" height="460" rx="12" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="700" y="100" width="260" height="36" rx="12" fill="#21262d"/>
  <text x="715" y="124" fill="#FBBC04" font-size="13" font-weight="600">3. DATA, SECURITY &amp; BACKUP</text>

  <!-- Cloud SQL HA -->
  <rect x="720" y="155" width="220" height="85" rx="8" fill="#0d1117" stroke="#FBBC04" stroke-width="1.5"/>
