  <rect x="370" y="100" width="260" height="460" rx="12" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="370" y="100" width="260" height="36" rx="12" fill="#21262d"/>
  <text x="385" y="124" fill="#34A853" font-size="13" font-weight="600">2. INTELLIGENCE &amp; EVENTS</text>

  <!-- Vertex AI Primary -->
