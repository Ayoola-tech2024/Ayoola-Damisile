  <rect x="720" y="355" width="220" height="65" rx="8" fill="#0d1117" stroke="#30363D" stroke-width="1.2"/>
  <text x="735" y="380" fill="#FFFFFF" font-size="13" font-weight="600">Cloud Storage Archive Tier</text>
  <text x="735" y="400" fill="#8B949E" font-size="11">7-Year Regulatory Compliance</text>

  <!-- upload.am Offsite -->
  <rect x="720" y="445" width="220" height="65" rx="8" fill="#0d1117" stroke="#4285F4" stroke-width="1.2"/>
  <text x="735" y="470" fill="#FFFFFF" font-size="13" font-weight="600">upload.am Offsite Cloud</text>
  <text x="735" y="490" fill="#8B949E" font-size="11">Automated Daily 02:00 AM Sync</text>

  <!-- Connecting Arrows -->
  <!-- Ingestion to Processing -->
  <path d="M 280 185 L 390 185" stroke="#4285F4" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
  <path d="M 280 360 L 390 200" stroke="#34A853" stroke-width="2"/>
  <path d="M 280 370 L 390 380" stroke="#58A6FF" stroke-width="2"/>

  <!-- Processing to Data -->
  <path d="M 610 200 L 720 200" stroke="#4285F4" stroke-width="2"/>
  <path d="M 610 390 L 720 220" stroke="#FBBC04" stroke-width="2"/>
  <path d="M 830 240 L 830 355" stroke="#8B949E" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 830 420 L 830 445" stroke="#4285F4" stroke-width="2"/>

  <!-- Footer Stats -->
  <rect x="40" y="575" width="920" height="30" rx="6" fill="#161b22"/>
  <text x="60" y="595" fill="#8B949E" font-size="11">P95 Latency: &lt;800ms · Availability: 99.99% · Infrastructure TCO Reduction: -73% · Zero Double-Allocation Race Conditions</text>
